spring.application.name=runtrackerapp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/running_tracker}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.security.user.name=${SPRING_SECURITY_USER:sam}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:change-me}

bot.api.key=${BOT_API_KEY:change-me}
